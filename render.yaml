# One-click deploy: https://render.com/deploy?repo=https://github.com/mlnamata/RUCh
services:
  - type: web
    name: ruch-hub
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: RUCH_DB
        value: /data/ruch.db
      - key: RUCH_BACKUP_DIR
        value: /data/backups
      - key: RUCH_ADMIN_TOKEN
        generateValue: true
      - key: RUCH_OPERATOR_NAME
        sync: false
      - key: RUCH_OPERATOR_CONTACT
        sync: false
      - key: RUCH_OPERATOR_COUNTRY
        value: Czech Republic
    disk:
      name: ruch-data
      mountPath: /data
      sizeGB: 1
